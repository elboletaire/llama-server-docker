# llama-server curated model presets
# Hardware: RTX 5080 16GB VRAM + 64GB RAM (DDR5) — coding agents via pi
# Runtime: llama-server:prism (PrismML llama.cpp fork, build b10685)
#
# VRAM budget: ~14GB available after KDE desktop (~2GB overhead)
# RAM budget:  ~54GB available for CPU-offloaded layers / KV cache overflow
#
# Strategy:
#   qwen35-35b  — full GPU (auto-fit ~14.2GB), hybrid attention+SSM MoE
#   bonsai-27b  — ternary 27B (~7.2GB), needs the Prism fork kernels
#
# Auto-download: hf-repo / hf-file / mmproj-hf-file are stripped by entrypoint.sh
# before passing to llama-server — they are only used by auto-download.sh.

# ---------------------------------------------------------------------------
# MAX QUALITY AGENT — hybrid attention+SSM MoE, full GPU
# Use for: hard multi-step tasks, unfamiliar codebases, complex debugging
# Architecture: 40 layers total — 10 attention (KV cache) + 30 SSM/recurrent.
# VRAM breakdown (auto-fit, all 41 layers on GPU):
#   Weights:         ~12.8GB  (23 full MoE layers + 18 attention-only splits)
#   KV cache (q4_0): ~0.7GB  (only 10 attention layers x 131K ctx)
#   Recurrent state:  ~0.1GB  (SSM state for 40 layers, fixed size)
#   Compute buffer:   ~0.6GB
#   Total:           ~14.2GB  out of ~15.3GB available -> ~1.1GB headroom
# NOTE: mmproj (CLIP vision encoder) is intentionally omitted. Loading it
#   adds ~850MB on GPU (600MB weights + 248MB compute), shrinking headroom
#   to ~300MB and causing OOM during inference. Text-only use has no need for it.
# Verified on the Prism fork: loads and generates at ~81 t/s (8K ctx, q4_0 KV).
# ---------------------------------------------------------------------------
[qwen35-35b]
alias = qwen35-35b
model = /root/.cache/llama.cpp/Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf
hf-repo = unsloth/Qwen3.5-35B-A3B-GGUF
hf-file = Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.6
top-p = 0.95
top-k = 40
presence-penalty = 1.5
repeat-penalty = 1.0
reasoning-budget = 0
parallel = 1
kv-unified = 1

# ---------------------------------------------------------------------------
# TERNARY 27B — Bonsai 2 (Qwen3.8-27B ternary-quantized to 1.72 bits/weight)
# REQUIRES the PrismML fork. Stock llama.cpp rejects PQ2_0 as an unknown type.
#
# Packing choice: PQ2_0 (7.21GB), not PTQ1_0 (5.95GB). The two are a genuine
#   trade, not a size ladder — PTQ1_0 wins decode where memory bandwidth binds
#   (Ada, L4); PQ2_0 wins decode on Blackwell and wins prompt processing
#   everywhere. The 5080 is Blackwell (GB203, sm_120), and 16GB VRAM makes the
#   1.3GB saving pointless. Nearest measured row (RTX 5090): PQ2_0 130 tg /
#   3893 pp vs PTQ1_0 121 tg / 1805 pp.
#
# VRAM: ~7.2GB weights, leaving ~6.8GB for KV + compute. The backbone is ~75%
#   linear attention, so only ~25% of the 64 blocks accumulate full KV — long
#   contexts are unusually cheap here. Native context is 262144; 131072 is a
#   conservative start. UNVERIFIED: raise toward 262144 and watch VRAM.
#
# Sampling: thinking-mode values from the model card (temp=1.0). Deliberately
#   NOT the presence-penalty=1.5 used above — that is the non-thinking preset
#   and fights the reasoning trace. reasoning-budget is left unset: the card
#   states low reasoning effort is unsupported and degrades to xhigh anyway.
#
# Vision: optional 0.63GB Q8_0 mmproj. Uncomment the two lines to enable;
#   costs VRAM headroom, and text-only serving never needs it.
# ---------------------------------------------------------------------------
[bonsai-27b]
alias = bonsai-27b
model = /root/.cache/llama.cpp/Ternary-Bonsai-2-27B-PQ2_0.gguf
hf-repo = prism-ml/Ternary-Bonsai-2-27B-gguf
hf-file = Ternary-Bonsai-2-27B-PQ2_0.gguf
# mmproj = /root/.cache/llama.cpp/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
# mmproj-hf-file = Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
parallel = 1
kv-unified = 1
