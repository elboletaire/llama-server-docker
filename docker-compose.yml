networks:
  llama-server:
    external: false

volumes:
  models:
    driver: local

services:
  llama-server:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: llama-server:${IMAGE_TAG:-standard}
    container_name: llama-server
    restart: unless-stopped

    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Environment variables
    environment:
      # Server settings
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_JINJA=true

      # HTTP read/write timeout (from upstream a024d11). The entrypoint
      # defaults to 120s, too short for a cold replay of a near-full
      # context; 600s lets the slow turn finish instead of being killed
      # mid-flight and triggering a full reprocess on retry.
      - LLAMA_ARG_TIMEOUT=600

      # Prompt cache cap. The entrypoint default is 32768 MiB, sized for
      # upstream's box and its DeltaNet checkpoint retention. This machine
      # has 61GB total and needs headroom for CPU-offloaded layers, so the
      # cap is halved. Raise if agentic prefix reuse is evicting too early.
      - LLAMA_ARG_CACHE_RAM=16384

      # Router mode - use curated preset file (no filesystem auto-discovery)
      - LLAMA_ARG_MODELS_PRESET=/config/models.ini
      - LLAMA_ARG_MODELS_MAX=1
      - LLAMA_ARG_MODELS_AUTOLOAD=true
      - LLAMA_AUTO_DOWNLOAD=true          # Auto-download missing models on startup

      # Performance settings (default, can be overridden per-model in models.ini)
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_FLASH_ATTN=on
      - LLAMA_ARG_PARALLEL=2
      - LLAMA_ARG_KV_UNIFIED=1

    ports:
      - "11434:8080"  # Keep your existing port 11434

    volumes:
      - models:/models
      - ${MODELS_PATH:-~/.cache/llama.cpp}:/root/.cache/llama.cpp  # Mount local model cache (writable for auto-download)
      - ./config:/config:ro  # models.ini (must be /config for llama.cpp)
      - ./logs:/app/logs
      - ./scripts:/scripts:ro  # healthcheck script

    networks:
      - llama-server

    # Health check
    healthcheck:
      test: ["CMD", "bash", "/scripts/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 600s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
